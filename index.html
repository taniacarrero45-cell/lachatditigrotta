<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>👑 IMPERO TIGROTTA: LEFT CHAT 👑</title>
    <style>
        body { margin: 0; background: #000 url('https://wallpapercave.com/wp/wp4033324.jpg') no-repeat center center fixed; background-size: cover; color: #eee; font-family: sans-serif; height: 100vh; display: flex; overflow: hidden; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 1; }
        #home-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .neon-title { color: #fff; text-shadow: 0 0 20px #ff00ff; font-size: 5em; text-transform: uppercase; }
        .btn-entra { padding: 20px 60px; background: linear-gradient(90deg, #ff00ff, #00f2ff); color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 1.5em; text-transform: uppercase; }

        #content-wrapper { position: relative; z-index: 10; display: flex; width: 100%; height: 100%; }
        
        /* SIDEBAR SINISTRA AGGIORNATA */
        #sidebar { width: 250px; background: rgba(10, 10, 10, 0.95); border-right: 2px solid #ff00ff33; display: flex; flex-direction: column; padding: 10px; box-sizing: border-box; gap: 10px; }
        .boss-input { width: 100%; padding: 8px; background: #111; border: 1px solid #ff00ff; color: #ff00ff; border-radius: 5px; font-weight: bold; box-sizing: border-box; }
        
        /* CONTENITORE CHATTINA GHOST A SINISTRA */
        #left-chat-container { flex: 1; border: 1px solid #00f2ff; border-radius: 10px; overflow: hidden; background: #000; margin-top: 10px; }

        /* AREA CENTRALE: RULLO CHAT */
        #main { flex: 1; display: flex; flex-direction: column; background: rgba(0, 0, 0, 0.2); }
        .header { padding: 10px; background: rgba(30, 30, 30, 0.9); text-align: center; color: #ff00ff; font-weight: bold; border-bottom: 2px solid #222; text-transform: uppercase; font-size: 0.8em; }
        
        /* PANNELLO DESTRA: SOLO VIDEO */
        #right-panel { width: 380px; background: rgba(10, 10, 10, 0.9); border-left: 2px solid #00f2ff33; display: flex; flex-direction: column; padding: 10px; gap: 10px; align-items: center; }
        .square-cam { width: 350px; height: 350px; border: 2px solid #ff00ff; border-radius: 10px; overflow: hidden; background: #000; }
        .video-box { width: 100%; aspect-ratio: 16/9; border: 1px solid #00f2ff; border-radius: 5px; overflow: hidden; }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="home-page">
        <h1 class="neon-title">TIGROTTA</h1>
        <button class="btn-entra" onclick="document.getElementById('home-page').style.display='none'">ENTRA</button>
    </div>

    <div id="overlay"></div>

    <div id="content-wrapper">
        <div id="sidebar">
            <div class="header">👑 BOSS PANEL</div>
            <input type="text" id="room-input" class="boss-input" placeholder="Stanza...">
            <button class="boss-input" style="background:#ff00ff; color:white; border:none; cursor:pointer;" onclick="cambiaTutto()">CAMBIA STANZA</button>
            
            <div class="header" style="color:#00f2ff; margin-top:10px;">👻 CHATTINA</div>
            <div id="left-chat-container">
                <iframe id="ghost-frame" src="https://www5.cbox.ws/box/?boxid=960938&boxtag=AP3Bo3"></iframe>
            </div>
        </div>

        <div id="main">
            <div class="header" id="title-main">🏟️ ARENA DI TIGROTTA</div>
            <iframe src="https://www5.cbox.ws/box/?boxid=960938&boxtag=AP3Bo3"></iframe>
        </div>

        <div id="right-panel">
            <div class="header">🔳 CAM VIDEO</div>
            <div class="square-cam">
                <iframe id="cam-frame" src="https://meet.jit.si/ArenaTigrotta2024#config.prejoinPageEnabled=false" allow="camera; microphone; display-capture; fullscreen; autoplay"></iframe>
            </div>

            <div class="header" style="color:#00f2ff;">📺 YOUTUBE</div>
            <div class="video-box">
                <iframe id="yt-player" src="https://www.youtube.com/embed/21X5lGlDOfg" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        function cambiaTutto() {
            let nome = document.getElementById('room-input').value.trim();
            if(nome === "") return;
            let clean = nome.replace(/\s+/g, '');
            
            document.getElementById('title-main').innerText = "🏟️ STANZA: " + nome.toUpperCase();
            document.getElementById('cam-frame').src = "https://meet.jit.si/" + clean + "Tigrotta#config.prejoinPageEnabled=false";
            
            // Ricarica la chattina a sinistra
            document.getElementById('ghost-frame').src = document.getElementById('ghost-frame').src;
            
            document.getElementById('room-input').value = "";
        }
    </script>
</body>
</html>
