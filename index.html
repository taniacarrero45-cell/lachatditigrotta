<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>👑 IMPERO DI TIGROTTA 👑</title>
    <style>
        /* SFONDO E STRUTTURA */
        body { margin: 0; background: #000; color: #eee; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; overflow: hidden; }
        
        /* SCHERMATA INIZIALE NEON */
        #home-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: 1s; }
        .neon-title { color: #fff; text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #ff00ff; font-size: 5em; letter-spacing: 10px; margin-bottom: 30px; text-transform: uppercase; }
        .btn-entra { padding: 20px 60px; background: linear-gradient(90deg, #ff00ff, #00f2ff); color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 1.5em; box-shadow: 0 0 20px #ff00ff66; transition: 0.3s; text-transform: uppercase; }
        .btn-entra:hover { transform: scale(1.1); box-shadow: 0 0 40px #00f2ff; }

        /* LAYOUT ARENA */
        #sidebar { width: 260px; background: #0a0a0a; border-right: 2px solid #ff00ff33; display: flex; flex-direction: column; }
        #main { flex: 1; background: #000; display: flex; flex-direction: column; position: relative; }
        #right-panel { width: 260px; background: #0a0a0a; border-left: 2px solid #00f2ff33; padding: 10px; }
        
        /* TESTATE */
        .header { padding: 20px; background: #151515; text-align: center; color: #ff00ff; font-weight: bold; border-bottom: 2px solid #222; text-transform: uppercase; letter-spacing: 2px; }
        
        /* CHAT E LIVE */
        iframe { width: 100%; height: 100%; border: none; }
        .live-placeholder { width: 100%; aspect-ratio: 4/3; background: #000; border: 2px solid #00f2ff; border-radius: 15px; margin-top: 15px; display: flex; align-items: center; justify-content: center; color: #00f2ff; font-size: 0.8em; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="home-page">
        <h1 class="neon-title">Tigrotta</h1>
        <button class="btn-entra" onclick="document.getElementById('home-page').style.opacity='0'; setTimeout(()=>{document.getElementById('home-page').style.display='none'}, 1000)">Entra nel Regno</button>
    </div>

    <div id="sidebar">
        <div class="header">💎 Stanze</div>
        <div style="padding:20px; color:#ff00ff; font-weight:bold; background: #1a1a1a; cursor: pointer;">🏟️ ARENA PRINCIPALE</div>
        <div style="padding:20px; color:#444; cursor: not-allowed;">👑 PRIVATA BOSS</div>
        <div style="padding:20px; color:#444; cursor: not-allowed;">🔥 ZONA VIP</div>
    </div>

    <div id="main">
        <div class="header">🏟️ ARENA DI TIGROTTA 🏟️</div>
        <iframe src="https://www5.cbox.ws/box/?boxid=960938&boxtag=AP3Bo3"></iframe>
    </div>

    <div id="right-panel">
        <div class="header" style="color:#00f2ff;">🎥 Live Cam</div>
        <div class="live-placeholder">In attesa della Boss...</div>
        <div style="margin-top: 20px; color: #666; font-size: 0.9em; text-align: center;">
            Benvenuta nell'Impero.<br>Rispetta le regole o fuori!
        </div>
    </div>

</body>
</html>
